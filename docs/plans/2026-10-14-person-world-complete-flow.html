const nav = document.getElementById('navigation');
const select = document.getElementById('mobile-navigation');
const canvas = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
let active = 0;
let scale = 1;
let autoFit = true;
let readable = true;
diagrams.forEach((diagram,index) => {
  const button=document.createElement('button');button.textContent=diagram.title;button.type='button';button.onclick=()=>show(index);nav.append(button);
  const option=document.createElement('option');option.value=index;option.textContent=diagram.title;select.append(option);
  const section=document.createElement('section');section.className='print-page';const h=document.createElement('h2');h.textContent=diagram.title;section.append(h);section.insertAdjacentHTML('beforeend',diagram.svg.replace(/ id="[^"]*"/g,''));document.getElementById('print-pages').append(section);
});
function resizeSvg(){
  const svg=canvas.querySelector('svg');const d=diagrams[active];
  svg.style.width=Math.round(d.width*scale)+'px';svg.style.height=Math.round(d.height*scale)+'px';
  document.getElementById('zoom-value').textContent=Math.round(scale*100)+'%';
}
function fit(){autoFit=true;const d=diagrams[active];const overview=Math.min((viewport.clientWidth-44)/d.width,(viewport.clientHeight-44)/d.height,1);scale=readable?Math.max(1,overview):overview;resizeSvg();viewport.scrollTop=0;const entry=canvas.querySelector('.node');if(entry&&readable){const b=entry.getBoundingClientRect(),v=viewport.getBoundingClientRect();viewport.scrollLeft+=b.left+b.width/2-v.left-viewport.clientWidth/2}else{viewport.scrollLeft=0}}
function zoom(factor){autoFit=false;scale=Math.max(.08,Math.min(2.5,scale*factor));resizeSvg();}
function show(index){
  active=index;const d=diagrams[index];canvas.innerHTML=d.svg;const svg=canvas.querySelector('svg');svg.setAttribute('role','img');svg.setAttribute('aria-label',d.title);document.getElementById('diagram-title').textContent=d.title;
  const notes=document.getElementById('notes');notes.replaceChildren();d.note.split('\n\n').filter(Boolean).forEach(text=>{const p=document.createElement('p');p.textContent=text;notes.append(p)});
  [...nav.children].forEach((button,i)=>{if(i===index)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current')});select.value=index;readable=true;fit();history.replaceState(null,'','#flow-'+index);
}
select.onchange=()=>show(Number(select.value));document.getElementById('zoom-out').onclick=()=>zoom(.8);document.getElementById('zoom-in').onclick=()=>zoom(1.25);document.getElementById('fit').onclick=()=>{readable=false;fit()};
document.getElementById('actual').onclick=()=>{autoFit=false;scale=1;resizeSvg()};document.getElementById('print').onclick=()=>window.print();
new ResizeObserver(()=>{if(autoFit)fit()}).observe(viewport);
const initial=Number(location.hash.replace('#flow-',''));show(Number.isInteger(initial)&&initial>=0&&initial<diagrams.length?initial:0);
</script>
